<body>
<a class="skip" href="#main">Skip to results</a>
<div class="review-strip"><strong>Design preview</strong> · Illustrative school names and values · Not published EQAO results</div>
<header class="header"><div class="header-inner"><div class="brand"><span class="brand-mark" aria-hidden="true">▂▅▇</span> EQAO Explorer</div><nav class="nav" aria-label="Main navigation"><button data-view="school" aria-current="page">My school</button><button data-view="explore">Explore schools</button><button data-view="boards">Compare boards</button></nav></div></header>
<main id="main">
<div id="page"></div>
<section id="secondary" class="secondary-section" hidden></section>
<p id="announcer" class="sr-only" role="status"></p>
</main>
<footer class="footer"><p>Independent exploration of Ontario’s Grade 3 & 6 results.<br>This review prototype uses illustrative data throughout.</p><div class="links"><button class="text-button" data-secondary="sources">Sources & definitions</button><button class="text-button" data-secondary="archive">Historical archive</button><button class="text-button" id="download">Download sample CSV ↓</button></div></footer>
<script>
(() => {
'use strict';
const subjects=['Reading','Writing','Mathematics'], colors=['#28617b','#a45d43','#78618f'];
// Deliberately synthetic fixtures. No real school names, results, or statistics.
const schools=[
 {id:'maple',name:'Maple Grove Public School',city:'Oakbridge',board:'North Valley DSB',type:'Public',lang:'en',n:64,values:[[65,67,70,74,78],[68,71,73,74,76],[51,55,61,65,71]]},

 {id:'stanne',name:'St. Anne’s School',city:'Oakbridge',board:'River District Catholic DSB',type:'Catholic',lang:'en',n:46,values:[[69,71,73,73,77],[72,72,74,75,78],[59,61,65,66,71]]},

 {id:'elm',name:'Elm Ridge Public School',city:'Brookfield',board:'North Valley DSB',type:'Public',lang:'en',n:35,values:[[64,65,68,70,73],[65,68,70,72,75],[54,57,60,64,67]]},

 {id:'meadow',name:'Meadow Lane Public School',city:'Brookfield',board:'North Valley DSB',type:'Public',lang:'en',n:25,values:[[58,60,62,65,72],[64,65,66,69,75],[49,52,57,60,68]]},

 {id:'erables',name:'École des Érables',city:'Oakbridge',board:'Conseil de la Vallée',type:'Public',lang:'fr',n:42,values:[[77,78,80,81,84],[78,79,81,82,85],[65,67,71,73,76]]},
 {id:'ruisseau',name:'École du Ruisseau',city:'Brookfield',board:'Conseil de la Vallée',type:'Public',lang:'fr',n:27,values:[[79,80,83,85,82],[80,81,83,85,83],[68,70,73,76,74]]}
];
const province=[[68,69,70,72,73],[70,71,72,73,74],[55,57,60,62,65]];
let state={view:'school',school:'maple',grade:3,year:4,subject:0,language:'en',board:'all',minimum:0,type:'all',consistent:false,more:false,expanded:null,showBoard:false,peer:null,showAll:false,picker:false,query:''};
const page=document.getElementById('page'), secondary=document.getElementById('secondary');
const esc=s=>String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const yl=i=>`${2021+i}–${String(2022+i).slice(-2)}`;
const current=()=>schools.find(s=>s.id===state.school);
const gradeShift=i=>state.grade===6?[3,2,-6][i]:0;
const val=(s,i,y=state.year)=>s.values[i][y]+gradeShift(i);
const pv=(i,y=state.year)=>province[i][y]+gradeShift(i)+(state.language==='fr'?5:0);
const change=(s,i=state.subject)=>state.year?val(s,i)-val(s,i,state.year-1):null;
const measure=s=>state.subject===3?[0,1,2].reduce((a,i)=>a+val(s,i),0)/3:val(s,state.subject);
const participants=s=>s.n+(state.subject<3?state.subject*2:0);
const delta=s=>state.year?(state.subject===3?[0,1,2].reduce((a,i)=>a+change(s,i),0)/3:change(s)):null;
const fmt=n=>Number(n.toFixed(1));
const signed=n=>`${n>0?'+':''}${fmt(n)}`;
const words=n=>n===null?'Previous year unavailable':n===0?'Unchanged since last year':`${n>0?'Up':'Down'} ${fmt(Math.abs(n))} percentage points`;
const boards=()=>[...new Set(schools.filter(s=>s.lang===state.language).map(s=>s.board))];
const boardVal=(board,i,y=state.year)=>{const index=[...new Set(schools.map(s=>s.board))].indexOf(board);return province[i][y]+gradeShift(i)+[1,3,7][index]};
function options(list,v){return list.map(([key,label])=>`<option value="${key}" ${String(key)===String(v)?'selected':''}>${esc(label)}</option>`).join('')}
function filters(){const global=state.view!=='school';return `<div class="filters"><div class="control"><span>GRADE</span><div class="segmented" aria-label="Grade"><button data-grade="3" aria-pressed="${state.grade===3}">Grade 3</button><button data-grade="6" aria-pressed="${state.grade===6}">Grade 6</button></div></div><label class="control"><span>SCHOOL YEAR</span><select data-field="year" aria-label="School year">${options([4,3,2,1,0].map(y=>[y,yl(y)]),state.year)}</select></label>${state.view==='explore'?`<label class="control"><span>SUBJECT</span><select data-field="subject" aria-label="Subject">${options([...subjects,'Average across subjects'].map((s,i)=>[i,s]),state.subject)}</select></label><label class="control"><span>BOARD</span><select data-field="board" aria-label="School board">${options([['all','All boards'],...boards().map(b=>[b,b])],state.board)}</select></label>`:''}${global?`<label class="control"><span>SYSTEM</span><select data-field="language" aria-label="Language system">${options([['en','English'],['fr','French']],state.language)}</select></label>`:''}${state.view==='explore'?`<button data-action="filters" aria-expanded="${state.more}">More filters${state.minimum||state.type!=='all'||state.consistent?' · Active':''} ${state.more?'−':'+'}</button>`:`<p class="filter-note">${state.view==='school'?`${current().lang==='en'?'English':'French'}-language · ${current().type}`:'Published benchmark comparison · illustrative values'}</p>`}</div>${state.view==='explore'&&state.more?`<div class="advanced"><div class="row"><label class="control"><span>PARTICIPANTS IN BOTH YEARS</span><select data-field="minimum" aria-label="Participant minimum">${options([[0,'All group sizes'],[20,'At least 20'],[30,'At least 30'],[50,'At least 50']],state.minimum)}</select></label><label class="control"><span>BOARD TYPE</span><select data-field="type" aria-label="Board type">${options([['all','All types'],['Public','Public'],['Catholic','Catholic']],state.type)}</select></label>${state.subject===3?`<label class="check"><input type="checkbox" data-field="consistent" ${state.consistent?'checked':''}>All subjects moving in the same direction</label>`:''}<button class="text-button" data-action="reset">Reset extra filters</button></div></div>`:''}`}
function chart(s,i,large=false){const width=large?640:300,height=large?235:150,left=30,right=large?75:18,top=12,bottom=27,w=width-left-right,h=height-top-bottom,x=y=>left+(w*y/4),y=v=>top+h*(1-v/100);const line=(values,color,dashed=false)=>`<polyline points="${values.map((v,j)=>`${x(j)},${y(v)}`).join(' ')}" fill="none" stroke="${color}" stroke-width="${dashed?1.5:2.5}" ${dashed?'stroke-dasharray="4 4"':''}/>`;const values=s.values[i].map((v,j)=>val(s,i,j)).slice(0,state.year+1),base=province[i].map((v,j)=>pv(i,j)).slice(0,state.year+1);let out=`<svg class="spark" viewBox="0 0 ${width} ${height}" role="img" aria-label="${esc(subjects[i])}, Grade ${state.grade}: ${values.map((v,j)=>yl(j)+': '+v+' percent').join('; ')}. Ontario: ${base.join(', ')} percent. Shared zero to 100 percent scale.">`;out+=[0,50,100].map(v=>`<line x1="${left}" x2="${width-right}" y1="${y(v)}" y2="${y(v)}" stroke="#e1e2dc"/><text x="${left-7}" y="${y(v)+4}" text-anchor="end">${v}${v===100?'%':''}</text>`).join('');out+=line(base,'#899086',true)+line(values,colors[i]);if(large&&state.showBoard)out+=line(values.map((_,j)=>boardVal(s.board,i,j)),'#b49651',true);if(large&&state.peer)out+=line(schools.find(p=>p.id===state.peer).values[i].map((v,j)=>val(schools.find(p=>p.id===state.peer),i,j)).slice(0,state.year+1),'#527d72');out+=values.map((v,j)=>`<circle cx="${x(j)}" cy="${y(v)}" r="${j===state.year?4:2.5}" fill="${colors[i]}"><title>${yl(j)}: ${v}%</title></circle>`).join('');out+=`<text x="${left}" y="${height-5}">${yl(0)}</text><text x="${width-right}" y="${height-5}" text-anchor="end">${yl(4)}</text></svg>`;return out}
function picker(){return `<section class="picker"><label for="school-search">Find a school</label><input type="search" id="school-search" placeholder="School name or city…" value="${esc(state.query)}"><div class="picker-results" id="picker-results">${matches()}</div><p class="small muted" style="margin-top:12px">${schools.length} illustrative schools available in this preview.</p></section>`}
function matches(){const rows=schools.filter(s=>(s.name+' '+s.city).toLowerCase().includes(state.query.toLowerCase()));return rows.length?rows.map(s=>`<button data-school="${s.id}"><span>${esc(s.name)}</span><small>${esc(s.city)} · ${s.lang==='en'?'English':'French'} · ${s.type}</small></button>`).join(''):'<p class="muted">No matching sample schools. Try “Maple” or “Oakbridge”.</p>'}
function comparison(){if(state.expanded===null)return '';const i=state.expanded,s=current();return `<section class="comparison-panel" id="comparison"><div class="row spread"><div><p class="eyebrow">${subjects[i]} · Grade ${state.grade}</p><h2 style="margin-top:7px">A little more context.</h2></div><button data-action="close-compare">Close comparison</button></div><div class="comparison-options"><span class="check"><span class="line-key" style="border-color:${colors[i]}"></span>${esc(s.name)}</span><span class="check"><span class="line-key dashed"></span>Ontario</span><label class="check"><input type="checkbox" data-field="showBoard" ${state.showBoard?'checked':''}>School board</label><label class="control"><span>ADD A COMPARISON SCHOOL</span><select data-field="peer" aria-label="Comparison school">${options([['','None'],...schools.filter(p=>p.id!==s.id&&p.lang===s.lang).map(p=>[p.id,p.name])],state.peer||'')}</select></label></div><div class="detail-chart">${chart(s,i,true)}</div><p class="small muted">${state.showBoard?'Gold dashed line: school board. ':''}${state.peer?`Green line: ${esc(schools.find(p=>p.id===state.peer).name)}. `:''}Each year describes a different group of students.</p><details style="margin-top:14px"><summary>View chart values</summary><div class="table-wrap"><table><thead><tr><th>Year</th><th class="num">School</th><th class="num">Ontario</th>${state.showBoard?'<th class="num">Board</th>':''}${state.peer?'<th class="num">Comparison school</th>':''}</tr></thead><tbody>${Array.from({length:state.year+1},(_,j)=>`<tr><th>${yl(j)}</th><td class="num">${val(s,i,j)}%</td><td class="num">${pv(i,j)}%</td>${state.showBoard?`<td class="num">${boardVal(s.board,i,j)}%</td>`:''}${state.peer?`<td class="num">${val(schools.find(p=>p.id===state.peer),i,j)}%</td>`:''}</tr>`).join('')}</tbody></table></div></details></section>`}
function schoolView(){const s=current(),changes=subjects.map((_,i)=>change(s,i)),highest=changes[0]===null?null:changes.indexOf(Math.max(...changes));return `<div class="page-head"><div><p class="eyebrow">Your school, at a glance</p><h1>${esc(s.name)}</h1><p class="subtitle">${esc(s.board)} · ${esc(s.city)}</p></div><button data-action="picker" aria-expanded="${state.picker}">${state.picker?'Close search':'Change school'}</button></div>${state.picker?picker():''}${filters()}<div class="overview-caption"><span>Students meeting or exceeding the provincial standard</span><span>Levels 3 & 4 · ${yl(state.year)}</span></div><div class="subjects">${subjects.map((subject,i)=>`<article class="subject"><h3><span class="dot" style="background:${colors[i]}"></span>${subject}</h3><p class="score">${val(s,i)}<span>%</span></p><p class="delta ${changes[i]<0?'down':''}">${words(changes[i])}${changes[i]!==null&&changes[i]!==0?' since last year':''}</p><p class="benchmark">Ontario ${pv(i)}% · ${Math.abs(val(s,i)-pv(i))} points ${val(s,i)>=pv(i)?'above':'below'}</p>${chart(s,i)}<div class="chart-key"><span><i class="line-key" style="border-color:${colors[i]}"></i>School</span><span><i class="line-key dashed"></i>Ontario</span></div><div class="subject-bottom"><span>${s.n+i*2} participating students</span><button class="text-button" data-compare="${i}" aria-expanded="${state.expanded===i}" aria-controls="comparison">Compare ${subject.toLowerCase()} ↗</button></div></article>`).join('')}</div><p class="caption">Charts share a 0–100% scale. Different students participate each year; changes do not follow the same children over time.</p>${comparison()}<div class="finding"><p class="eyebrow">What stands out</p><div><p>${highest===null?'Select a later year to see how results changed.':changes.every(n=>n>0)?`All three subjects increased this year. ${subjects[highest]} had the largest change, up ${changes[highest]} percentage points.`:changes.every(n=>n<0)?'All three subjects decreased compared with the previous year.':`Results changed differently across subjects. ${subjects[highest]} changed by ${signed(changes[highest])} percentage points.`}</p><p>These results describe a pattern; they do not explain what caused it.</p></div></div><details class="disclosure"><summary>Compare with other schools <span class="hint">Choose a school and subject</span></summary><div class="detail-body"><p class="small muted">Add a school to a subject chart for a direct comparison.</p><div class="row"><label class="control"><span>SCHOOL</span><select data-field="peer" aria-label="School to add">${options([['','Choose a school'],...schools.filter(p=>p.id!==s.id&&p.lang===s.lang).map(p=>[p.id,p.name])],state.peer||'')}</select></label>${subjects.map((n,i)=>`<button data-compare="${i}">${n} ↗</button>`).join('')}</div></div></details><details class="disclosure"><summary>Achievement levels and participation <span class="hint">Behind the percentage</span></summary><div class="detail-body"><p class="small muted">Illustrative breakdown for Grade ${state.grade}, ${yl(state.year)}. Levels 3 and 4 meet the provincial standard.</p><div class="table-wrap"><table><thead><tr><th>Subject</th><th class="num">Level 1</th><th class="num">Level 2</th><th class="num">Level 3</th><th class="num">Level 4</th><th class="num">Participating / registered</th></tr></thead><tbody>${subjects.map((n,i)=>{const v=val(s,i),l1=Math.round((100-v)*.3),l4=Math.round(v*.3);return `<tr><th>${n}</th><td class="num">${l1}%</td><td class="num">${100-v-l1}%</td><td class="num">${v-l4}%</td><td class="num">${l4}%</td><td class="num">${s.n+i*2} / ${s.n+i*2+3}</td></tr>`}).join('')}</tbody></table></div></div></details><details class="disclosure"><summary>Questions to ask the school <span class="hint">Turn a pattern into a conversation</span></summary><div class="detail-body compact-copy"><p>“What are your current priorities in ${highest===null?'reading, writing and mathematics':subjects[highest].toLowerCase()}, and how will families know whether the support is helping?”</p><p class="small muted">The school can add context about the students, learning environment, and support behind these results.</p></div></details><p class="caption" style="margin-top:24px">Results are one part of understanding a school. Belonging, programs, safety, and support matter too.</p>`}
function exploreRows(){return schools.filter(s=>s.lang===state.language&&(state.board==='all'||s.board===state.board)&&(state.type==='all'||s.type===state.type)&&participants(s)>=state.minimum&&(!state.consistent||state.subject!==3||[0,1,2].every(i=>change(s,i)>0)||[0,1,2].every(i=>change(s,i)<0)))}
function rankList(rows,increase){const sorted=rows.filter(s=>increase?delta(s)>0:delta(s)<0).sort((a,b)=>increase?delta(b)-delta(a):delta(a)-delta(b)),shown=sorted.slice(0,state.showAll?50:5);return `<section><div class="ranking-heading"><h2>${increase?'Largest increases':'Largest decreases'}</h2><span class="small muted">${sorted.length} schools</span></div>${shown.length?shown.map((s,i)=>`<div class="rank"><span class="rank-index">${sorted.findIndex(p=>delta(p)===delta(s))+1}</span><div><button class="rank-name" data-school="${s.id}">${esc(s.name)} ↗</button><p class="rank-meta">${esc(s.city)} · ${participants(s)} students${participants(s)<30?' · Small group':''}</p><p class="small muted">${fmt(measure(s)-delta(s))}% → ${fmt(measure(s))}%</p><div class="rank-bar"><span style="width:${Math.min(100,Math.abs(delta(s))*10)}%;background:${increase?'var(--blue)':'var(--rust)'}"></span></div></div><div class="rank-value">${signed(delta(s))}<small>points</small></div></div>`).join(''):'<p class="empty">No schools in this group.</p>'}</section>`}
function exploreView(){const rows=exploreRows(),paired=state.year?rows:[],inc=paired.filter(s=>delta(s)>0).length,dec=paired.filter(s=>delta(s)<0).length,n=paired.length,changes=paired.map(delta).sort((a,b)=>a-b),median=n?(n%2?changes[(n-1)/2]:(changes[n/2-1]+changes[n/2])/2):null;return `<div class="page-head"><div><p class="eyebrow">Explore Ontario</p><h1>Where are results moving?</h1><p class="subtitle">Find a school, or explore how results changed over the past year.</p></div><button data-action="picker" aria-expanded="${state.picker}">${state.picker?'Close search':'Find a school'}</button></div>${state.picker?picker():''}${filters()}<p class="stateline">${n?`<strong>${signed(median)} points</strong> median school change · ${n} sample schools · ${yl(state.year-1)} → ${yl(state.year)}`:'No paired annual results for this selection.'}</p>${n?`<div class="direction" aria-label="${inc} increasing, ${n-inc-dec} unchanged, ${dec} decreasing"><span style="width:${inc/n*100}%;background:var(--blue)"></span><span style="width:${(n-inc-dec)/n*100}%;background:#b1b6ad"></span><span style="width:${dec/n*100}%;background:var(--rust)"></span></div><div class="direction-labels"><span>${inc} increasing</span><span>${n-inc-dec} unchanged</span><span>${dec} decreasing</span></div>`:''}${state.subject===3?'<p class="caption">Average across subjects is the equal-weight mean of reading, writing, and mathematics. It is not an official combined EQAO score.</p>':''}<div class="ranking-grid">${rankList(paired,true)}${rankList(paired,false)}</div>${n>5?`<div class="row spread ranking-foot"><p class="small muted">Showing up to ${state.showAll?'all':'five'} schools in each direction.</p><button data-action="show-all">${state.showAll?'Show fewer':'Show all matching schools'}</button></div>`:''}<p class="caption" style="margin-top:25px">Bars use the same 0–10 percentage-point scale. A change from 70% to 75% is 5 percentage points. Smaller groups can show larger swings between years.</p><details class="disclosure" style="margin-top:20px"><summary>Results and participant counts <span class="hint">View all matching schools</span></summary><div class="detail-body table-wrap"><table><thead><tr><th>School</th><th class="num">Previous</th><th class="num">Current</th><th class="num">Change</th><th class="num">Students per subject*</th></tr></thead><tbody>${rows.map(s=>`<tr><td>${esc(s.name)}</td><td class="num">${state.year?fmt(measure(s)-delta(s))+'%':'—'}</td><td class="num">${fmt(measure(s))}%</td><td class="num">${delta(s)===null?'—':signed(delta(s))}</td><td class="num">${s.n}–${s.n+4}</td></tr>`).join('')}</tbody></table><p class="caption">*Sample group sizes are held constant across years in this mockup.</p></div></details>`}
function boardsView(){return `<div class="page-head"><div><p class="eyebrow">The wider context</p><h1>How do boards compare?</h1><p class="subtitle">One view of all three subjects, alongside Ontario.</p></div></div>${filters()}<p class="caption">Students meeting or exceeding the provincial standard · Grade ${state.grade} · ${yl(state.year)}</p><div class="board-list"><div class="board-row head"><span>Board / benchmark</span>${subjects.map(n=>`<span>${n}</span>`).join('')}</div>${['Ontario',...boards()].map(b=>`<div class="board-row"><div class="board-title">${esc(b)}<small>${b==='Ontario'?'Provincial benchmark':'Illustrative board results'}</small></div>${subjects.map((n,i)=>{const v=b==='Ontario'?pv(i):boardVal(b,i);return `<div><span class="board-label" hidden>${n}</span><p class="board-number">${v}<small>%</small></p><div class="board-track"><span style="width:${v}%;background:${b==='Ontario'?'#899086':colors[i]}"></span></div></div>`}).join('')}</div>`).join('')}</div><p class="caption" style="margin-top:20px">All bars use a 0–100% scale. Board percentages represent published aggregates in the full app; they are not an average of school percentages.</p>`}
function render(){const open=[...page.querySelectorAll('details[open]')].map(d=>d.querySelector('summary')?.textContent);page.innerHTML=state.view==='school'?schoolView():state.view==='explore'?exploreView():boardsView();page.querySelectorAll('details').forEach(d=>{if(open.includes(d.querySelector('summary')?.textContent))d.open=true});document.querySelectorAll('[data-view]').forEach(b=>{if(b.dataset.view===state.view)b.setAttribute('aria-current','page');else b.removeAttribute('aria-current')});document.getElementById('announcer').textContent=`${state.view==='school'?current().name:state.view==='explore'?'School trends':'Board comparison'}, Grade ${state.grade}, ${yl(state.year)}.`}
document.addEventListener('click',e=>{const b=e.target.closest('button');if(!b)return;const d=b.dataset;if(d.view){state.view=d.view;if(state.view==='school')state.language=current().lang;state.picker=false;state.query='';state.expanded=null;secondary.hidden=true;render()}else if(d.grade){state.grade=Number(d.grade);render()}else if(d.school){state.school=d.school;state.language=current().lang;state.board='all';state.peer=null;state.view='school';state.expanded=null;state.query='';state.picker=false;render();document.querySelector('h1').scrollIntoView({block:'start'})}else if(d.compare!==undefined){state.expanded=state.expanded===Number(d.compare)?null:Number(d.compare);render();if(state.expanded!==null){document.getElementById('comparison').scrollIntoView({block:'center'});document.querySelector('[data-action="close-compare"]').focus({preventScroll:true})}}else if(d.action){if(d.action==='picker')state.picker=!state.picker;if(d.action==='filters')state.more=!state.more;if(d.action==='show-all')state.showAll=!state.showAll;if(d.action==='reset'){state.minimum=0;state.type='all';state.consistent=false}if(d.action==='close-compare')state.expanded=null;render();if(d.action==='picker'&&state.picker)document.getElementById('school-search').focus()}else if(d.secondary){secondary.hidden=false;secondary.innerHTML=d.secondary==='sources'?'<div class="row spread"><h2>Sources & definitions</h2><button data-action="dismiss-secondary">Close</button></div><p>This is a design preview. All schools, board names, percentages, participant counts, and trends shown here are illustrative.</p><p>In the live app, this area contains original EQAO downloads, coverage notes, and definitions. “Meeting the provincial standard” means Levels 3 and 4. Missing or suppressed values must remain explicit.</p><p><a href="https://eqao-explorer.vercel.app/?view=sources" target="_blank" rel="noopener">Open the live app’s sources ↗</a></p>':'<div class="row spread"><h2>Historical archive</h2><button data-action="dismiss-secondary">Close</button></div><p>The 2017–19 archive moves here, away from the primary navigation. Earlier results remain separate from the current series.</p><p><a href="https://eqao-explorer.vercel.app/?view=archive" target="_blank" rel="noopener">Open the live archive ↗</a></p>';secondary.scrollIntoView({block:'center'})}if(d.action==='dismiss-secondary')secondary.hidden=true});
page.addEventListener('change',e=>{const f=e.target.dataset.field;if(!f)return;const old=e.target;state[f]=old.type==='checkbox'?old.checked:['year','subject','minimum'].includes(f)?Number(old.value):old.value||null;if(f==='language'){state.board='all'}if(f==='subject'&&state.subject!==3)state.consistent=false;render();const replacement=page.querySelector(`[data-field="${f}"]`);if(replacement)replacement.focus({preventScroll:true})});
page.addEventListener('input',e=>{if(e.target.id==='school-search'){state.query=e.target.value;document.getElementById('picker-results').innerHTML=matches()}});
document.getElementById('download').onclick=()=>{const rows=state.view==='school'?[current()]:exploreRows();const q=v=>'"'+String(v).replace(/"/g,'""')+'"';const lines=[['ILLUSTRATIVE DATA — DESIGN MOCKUP'],['School','Grade','Year',...subjects],...rows.map(s=>[s.name,state.grade,yl(state.year),...subjects.map((_,i)=>val(s,i))])];const url=URL.createObjectURL(new Blob([lines.map(r=>r.map(q).join(',')).join('\n')],{type:'text/csv;charset=utf-8'}));const a=document.createElement('a');a.href=url;a.download='eqao-mockup-illustrative-results.csv';a.click();setTimeout(()=>URL.revokeObjectURL(url),1000)};
render();
})();
</script>
</body>
